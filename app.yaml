runtime: python310  # or your Python version
entrypoint: gunicorn -b :$PORT main:app  # ✅ Use gunicorn to serve Flask
env_variables: 
  GOOGLE_CLOUD_PROJECT: "still-tensor-451016-i7"
  STORAGE_BUCKET: "emotion-game-dataset"


handlers:
- url: /.*
  script: auto

instance_class: F2  # (default is F1, F2 has more memory)

automatic_scaling:
  min_instances: 1
  max_instances: 5
  target_cpu_utilization: 0.65
  target_throughput_utilization: 0.65
  max_pending_latency: 30ms  # Set this to a higher value if needed.

