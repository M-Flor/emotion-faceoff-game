<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        body {
            font-family: Calibri;
            font-size: 18px;
            text-align: center;
            padding: 10px;
            margin: 0 auto;        /* Centers it on desktop */

        }
    </style>
    <script>
        function refreshPage() {
            setTimeout(function() {
                location.reload();
            }, 5000); // Refresh 
        }
        window.onload = refreshPage;
    </script>
</head>
<body>
    <h1>Game results dashboard</h1>
    <div class="stats-box">
        <h3>Total Players:</h3>
        <p id="userCount"><b>{{ unique_users }}</b></p>
    </div>
    <img src="data:image/png;base64, {{ plot_url_1 }}" alt="Scatter Plot">
    <img src="data:image/png;base64, {{ plot_url_2 }}" alt="Score Distribution Histogram">


</body>
</html>
